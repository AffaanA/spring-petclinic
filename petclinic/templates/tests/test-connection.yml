apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "petclinic.fullname" . }}-test"
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never

  containers:
    - name: test
      image: curlimages/curl:latest
      command:
        - curl
        - --fail
        - --silent
        - http://{{ include "petclinic.fullname" . }}:8080
